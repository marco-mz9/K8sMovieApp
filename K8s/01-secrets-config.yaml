apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: fintech
  labels:
    project: financial-management
type: Opaque
stringData:
  mongo-root-username: admin
  mongo-root-password: FinTechSecurePassword2026!
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fintech-config
  namespace: fintech
  labels:
    project: financial-management
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_INITDB_DATABASE: "mern_movies"
  MONGO_URI: "mongodb://mongodb:27017/mern_movies"
